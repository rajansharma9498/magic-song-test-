const data = snap.data();

}

lastSeq = data.seq;

document.getElementById("chromeNewTab").style.display = "none";

if (data.songUrl.includes("youtu")) {
document.body.innerHTML = "";
let cleanUrl = data.songUrl.replace("https://", "").replace("http://", "");
location.href = "intent://" + cleanUrl + "#Intent;package=com.google.android.youtube;scheme=https;end;";
} else if (data.songUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center;"><img src="${data.songUrl}" style="width:100vw; height:100vh; object-fit:contain; pointer-events:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;"></div>`;

function addLongPress(element, callback) {

const start = () => { pressTimer = setTimeout(callback, 2000); };
const cancel = () => { clearTimeout(pressTimer); };
element.addEventListener("touchstart", start);
element.addEventListener("touchend", cancel);
element.addEventListener("mousedown", start);
element.addEventListener("mouseup", cancel);
element.addEventListener("mouseleave", cancel);
}

function triggerMagic(textToSearch) {
let finalUrl = "";
let lowerText = textToSearch.toLowerCase();
let timeToWait = magicDelay * 1000;
let suit = "";
let value = "";

if(lowerText.includes("hukum") || lowerText.includes("spade") || lowerText.includes("हुकुम")) suit = "S";
else if(lowerText.includes("paan") || lowerText.includes("heart") || lowerText.includes("पान")) suit = "H";
else if(lowerText.includes("chidi") || lowerText.includes("club") || lowerText.includes("चिड़ी") || lowerText.includes("chidiya")) suit = "C";
else if(lowerText.includes("eet") || lowerText.includes("diamond") || lowerText.includes("dimond") || lowerText.includes("ईंट")) suit = "D";

if(lowerText.includes("ikka") || lowerText.includes("ace") || lowerText.includes("इक्का")) value = "A";
else if(lowerText.includes("badshah") || lowerText.includes("king") || lowerText.includes("बादशाह")) value = "K";
else if(lowerText.includes("begum") || lowerText.includes("queen") || lowerText.includes("बेगम")) value = "Q";
else if(lowerText.includes("gulam") || lowerText.includes("jack") || lowerText.includes("गुलाम")) value = "J";
else if(lowerText.includes("10") || lowerText.includes("दस")) value = "0"; 
else {
for(let i=2; i<=9; i++) {
if(lowerText.includes(i.toString())) value = i.toString();
}
}

if (suit !== "" && value !== "") {
finalUrl = "https://deckofcardsapi.com/static/img/" + value + suit + ".png"; 
} else if (searchMode === "2") {
finalUrl = "https://www.google.com/search?q=" + encodeURIComponent(textToSearch);
} else {
finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(textToSearch);
}

setTimeout(async () => {
try {
await setDoc(session, {
songUrl: finalUrl,
seq: Date.now(),
updatedAt: serverTimestamp()
}, { merge: true });
} catch (err) {}
}, timeToWait);
} 

} else if (mode === "deck") {
document.body.style.margin = "0";
document.body.style.padding = "0";
document.body.style.maxWidth = "100%";

let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0; 

if (localStorage.getItem("autoDeckSend") === null) {
    localStorage.setItem("autoDeckSend", "true");
}
let autoDeckSend = localStorage.getItem("autoDeckSend") === "true";

const suits = ["S", "H", "C", "D"];
const values = ["A", "2", "3", "4", "5", "6", "7", "8", "9", "0", "J", "Q", "K"];
let deck = [];
for(let s of suits) {
    for(let v of values) {
        deck.push(v + s);
    }
}
for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
}

onSnapshot(peekSession, (snap) => {
    if(snap.exists()) {
        const data = snap.data();
        if(Date.now() - data.time < 300000) {
            let pk = document.getElementById("deckPeekText");
            if(!pk) {
                pk = document.createElement("div");
                pk.id = "deckPeekText";
                pk.style.cssText = "position:absolute; top:10px; left:15px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:bold; z-index:9999; pointer-events:none;";
                document.body.appendChild(pk);
            }
            pk.textContent = data.text;
        }
    }
});

function renderDeckUI() {
    document.body.style.backgroundColor = "#0f4d0f"; 
    document.body.innerHTML = `
    <div style="width: 100vw; height: 100vh; background: #0f4d0f; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; box-sizing: border-box; overflow: hidden; font-family: sans-serif; position: relative;">
      
      <div id="secretAutoToggle" style="position: absolute; top: 0; right: 0; width: 60px; height: 60px; background: transparent; z-index: 100;"></div>

      <div id="deckContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 400px; overflow-y: auto; padding-bottom: 20px; height: 100%;">
      </div>
    </div>
    `;
    renderDeckCards();
    
    const toggleBtn = document.getElementById("secretAutoToggle");
    let toggleTimer;

    const startToggle = (e) => { 
        e.preventDefault(); 
        toggleTimer = setTimeout(() => {
            autoDeckSend = !autoDeckSend;
            localStorage.setItem("autoDeckSend", autoDeckSend);
            if (navigator.vibrate) {
                if(autoDeckSend) {
                    navigator.vibrate([100, 100, 100]); 
                } else {
                    navigator.vibrate(300); 
                }
            }
        }, 2000); 
    };

    const cancelToggle = () => { clearTimeout(toggleTimer); };

    toggleBtn.addEventListener("touchstart", startToggle);
    toggleBtn.addEventListener("touchend", cancelToggle);
    toggleBtn.addEventListener("mousedown", startToggle);
    toggleBtn.addEventListener("mouseup", cancelToggle);
    toggleBtn.addEventListener("mouseleave", cancelToggle);
}

function renderDeckCards() {
    let html = "";
    for(let i=0; i<52; i++) {
        let cardUrl = "https://deckofcardsapi.com/static/img/" + deck[i] + ".png";
        html += `<img class="card-face" data-index="${i}" src="${cardUrl}" style="width: 50px; height: 72px; border-radius: 4px; box-shadow: 1px 2px 5px rgba(0,0,0,0.5); margin-bottom: 5px; cursor: pointer; touch-action: manipulation;">`;
    }
    const deckContainer = document.getElementById("deckContainer");
    if(deckContainer) {
        deckContainer.innerHTML = html;
        const cards = document.querySelectorAll(".card-face");
        cards.forEach(card => {
            let lastTap = 0;
            card.addEventListener("click", function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                if (tapLength < 400 && tapLength > 0) {
                    const idx = this.getAttribute("data-index");
                    selectCard(deck[idx]);
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
        });
    }
}

function selectCard(cardCode) {
    const finalUrl = "https://deckofcardsapi.com/static/img/" + cardCode + ".png";
    document.body.style.backgroundColor = "#000000"; 
    document.body.innerHTML = `
    <div style="width: 100vw; height: 100vh; background: #000000; display: flex; align-items: center; justify-content: center; position: relative;">
        
        <button id="backToDeck" style="position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; z-index: 10;">← Back</button>
        
        <img src="${finalUrl}" style="width: 100vw; height: 100vh; object-fit: contain;">
        
        <div id="secretBottomRight" style="position: absolute; bottom: 0; right: 0; width: 80px; height: 80px; background: transparent; z-index: 10;"></div>
    </div>
    `;
    
    document.getElementById("backToDeck").addEventListener("click", () => {
        renderDeckUI();
    });

    const sendCardToAudience = () => {
        let timeToWait = magicDelay * 1000;
        setTimeout(async () => {
            try {
                await setDoc(session, {
                    songUrl: finalUrl,
                    seq: Date.now(),
                    updatedAt: serverTimestamp()
                }, { merge: true });
            } catch (err) {}
        }, timeToWait);
    };

    if (autoDeckSend) {
        sendCardToAudience();
    }

    const secretTrigger = document.getElementById("secretBottomRight");
    let pressTimer;

    const startPress = (e) => { 
        e.preventDefault(); 
        pressTimer = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate(100);
            sendCardToAudience();
        }, 2000); 
    };

    const cancelPress = () => { clearTimeout(pressTimer); };

    secretTrigger.addEventListener("touchstart", startPress);
    secretTrigger.addEventListener("touchend", cancelPress);
    secretTrigger.addEventListener("mousedown", startPress);
    secretTrigger.addEventListener("mouseup", cancelPress);
    secretTrigger.addEventListener("mouseleave", cancelPress);
}

renderDeckUI();

} else {
status.innerHTML = 'Choose a mode: <a href="?mode=magician">Magician</a> | <a href="?mode=audience">Audience</a> | <a href="?mode=notepad">Notepad</a> | <a href="?mode=deck">Digital Deck</a>';
} 

} catch (e) {
console.log("Error: " + e.message);
}
</script>
</body>
</html>
