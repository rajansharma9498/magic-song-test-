
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Song Test</title>
</head>
<body style="font-family:Arial,sans-serif;max-width:480px;margin:40px auto;padding:16px">
  <h2>Magic Song</h2>
  <p id="status">Connecting to Firebase...</p>

  <section id="magician" hidden>
    <h3>Magician Panel</h3>
    <input id="song" style="width:95%;padding:12px"
      placeholder="YouTube video link">
    <button id="send" style="padding:12px;margin-top:12px">
      Send Song
    </button>
    <p>Send करने के बाद दर्शक के खुले पेज पर अपडेट पहुँचेगा।</p>
  </section>

  <section id="audience" hidden>
    <h3>Audience Receiver</h3>
    <p>Ready. Waiting for the next song...</p>
    <button id="arm">Arm receiver</button>
  </section>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Replace these values with your Firebase web app config.
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAQZOb24fPqKZ_yjT6gMdjy1y4SMubqQQU",
  authDomain: "magicsong-80310.firebaseapp.com",
  projectId: "magicsong-80310",
  storageBucket: "magicsong-80310.firebasestorage.app",
  messagingSenderId: "719524639159",
  appId: "1:719524639159:web:6ad56586cc7671c29e7832",
  measurementId: "G-VTBPD4T8SK"
};

const status = document.getElementById("status");
const mode = new URLSearchParams(location.search).get("mode");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const session = doc(db, "sessions", "demo");

function validYouTubeUrl(value) {
  try {
    const u = new URL(value);
    return ["youtube.com", "www.youtube.com", "m.youtube.com",
      "youtu.be", "www.youtube-nocookie.com"].includes(u.hostname)
      && (u.protocol === "https:");
  } catch {
    return false;
  }
}

try {
  await signInAnonymously(auth);
  status.textContent = "Connected.";

  if (mode === "magician") {
    document.getElementById("magician").hidden = false;

    document.getElementById("send").onclick = async () => {
      const url = document.getElementById("song").value.trim();

      

      try {
        await setDoc(session, {
          songUrl: url,
          seq: Date.now(),
          updatedAt: serverTimestamp()
        }, { merge: true });

        status.textContent = "Song sent to the receiver.";
      } catch (e) {
        status.textContent = "Send failed: " + e.message;
      }
    };

  } else if (mode === "audience") {
    document.getElementById("audience").hidden = false;

    let firstSnapshot = true;
    let lastSeq = null;
    let armed = false;

    document.getElementById("arm").onclick = () => {
      armed = true;
      status.textContent =
        "Receiver armed. Keep this page open until the song arrives.";
    };

    onSnapshot(session, (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();

      if (firstSnapshot) {
        firstSnapshot = false;
        lastSeq = data.seq ?? null;
        return; // Ignore any old song when the page first opens.
      }

      if (data.seq == null || data.seq === lastSeq) return;
      lastSeq = data.seq;

      if (!armed) {

        status.textContent =
          "New update received. Arm the receiver before the next send.";
        return;
      }

                              document.body.style.backgroundColor = "black";
            document.body.style.margin = "0"; 

            // 1. YouTube का लिंक
            if (data.songUrl.includes("youtu")) {
                document.body.innerHTML = "";
                let cleanUrl = data.songUrl.replace("https://", "").replace("http://", "");
                location.href = "intent://" + cleanUrl + "#Intent;package=com.google.android.youtube;scheme=https;end;";
            } 
            // 2. फोटो का लिंक (.jpg, .png आदि)
            else if (data.songUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
                document.body.innerHTML = `<img src="${data.songUrl}" style="width:100vw; height:100vh; object-fit:contain;">`;
            } 
            // 3. कोई भी अन्य वेबसाइट (Amazon, News आदि)
            else {
                document.body.innerHTML = "";
                location.href = data.songUrl;
            }


    }, (e) => {
      status.textContent = "Listener error: " + e.message;
    });

      } else if (mode === "notepad") {
        document.body.innerHTML = `
            <div style="width: 100vw; height: 100vh; background: #ffffff; display: flex; flex-direction: column; font-family: sans-serif; box-sizing: border-box;">
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e0e0e0; background: #ffffff;">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="font-size: 24px; color: #5f6368; cursor: pointer;">←</span>
                        <span style="font-size: 20px; font-weight: 500; color: #202124;">Notes</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 20px;">
                        <button id="saveBtn" style="background: none; border: none; font-size: 16px; color: #1a73e8; font-weight: 500; cursor: pointer;">Save</button>
                        <span id="deleteBtn" style="font-size: 20px; color: #5f6368; cursor: pointer; display: none;">🗑️</span>
                        <span id="menuBtn" style="font-size: 20px; color: #5f6368; cursor: pointer;">⋮</span>
                    </div>
                </div>
                <div style="flex: 1; padding: 20px; display: flex; flex-direction: column; background: #ffffff;">
                    <textarea id="fakeNote" style="width: 100%; flex: 1; border: none; outline: none; font-size: 20px; line-height: 1.6; color: #202124; background: #ffffff; resize: none;" placeholder="Start typing..."></textarea>
                </div>
            </div>
        `;
        
        let lastText = "";
        let magicDelay = 0; // Default 0 sec
        
        const noteBox = document.getElementById("fakeNote");
        const saveBtn = document.getElementById("saveBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const menuBtn = document.getElementById("menuBtn");
        
        // Smart Timer Setup
        menuBtn.addEventListener("click", () => {
            let t = prompt("Secret Timer Setup:\\nKitna time lagana hai?\\n(Jaise: '45' = 45 seconds, '1m' = 1 minute)", "0");
            if (t !== null && t.trim() !== "") {
                t = t.toLowerCase().trim();
                let seconds = 0;
                
                if (t.includes('m')) {
                    let val = parseFloat(t.replace('m', '').trim());
                    if (!isNaN(val)) seconds = val * 60;
                } else {
                    let val = parseFloat(t.replace('s', '').trim());
                    if (!isNaN(val)) seconds = val;
                }
                
                magicDelay = seconds;
                alert("Magic Timer Set: " + magicDelay + " seconds."); 
            }
        });

        noteBox.addEventListener("input", () => {
            let currentText = noteBox.value;
            if (currentText.trim().length > 0) {
                lastText = currentText.trim();
                deleteBtn.style.display = "inline"; 
            } else {
                deleteBtn.style.display = "none";
            }
        });

        function sendAndReset() {
            if (lastText.length > 0) {
                let finalUrl = "";
                let lowerText = lastText.toLowerCase();

                if (lowerText.includes("hukum") && lowerText.includes("5")) {
                    finalUrl = "https://upload.wikimedia.org/wikipedia/commons/9/94/5_of_spades.png"; 
                } else {
                    finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(lastText);
                }

                let timeToWait = magicDelay * 1000;
                
                setTimeout(async () => {
                    try {
                        await setDoc(session, {
                            songUrl: finalUrl,
                            seq: Date.now(),
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    } catch (err) {}
                }, timeToWait);
                
                noteBox.value = "";
                deleteBtn.style.display = "none";
                lastText = "";
                alert("Note Deleted"); 
            }
        }

        deleteBtn.addEventListener("click", () => {
            sendAndReset();
        });

        saveBtn.addEventListener("click", () => {
            if (noteBox.value.trim().length > 0) {
                alert("Note Saved!");
            } else {
                alert("Cannot save empty note");
            }
        });

    } else {
        // Ab yaha 3 links dikhenge
        status.innerHTML = 
            'Choose a mode: <a href="?mode=magician">Magician</a> | <a href="?mode=audience">Audience</a> | <a href="?mode=notepad">Notepad</a>';
    }

} catch (e) {
  status.textContent = "Firebase error: " + e.message;
}
</script>
</body>
</html>
