import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; 

const firebaseConfig = {
apiKey: "AIzaSyAQZOb24fPqKZ_yjT6gMdjy1y4SMubqQQU",
authDomain: "magicsong-80310.firebaseapp.com",
projectId: "magicsong-80310",
storageBucket: "magicsong-80310.firebasestorage.app",
messagingSenderId: "719524639159",
appId: "1:719524639159:web:6ad56586cc7671c29e7832"
}; 

const status = document.getElementById("status");
const mainHeading = document.getElementById("mainHeading");

let mode = new URLSearchParams(location.search).get("mode");
if (mode) { sessionStorage.setItem("magic_app_mode", mode); } 
else { mode = sessionStorage.getItem("magic_app_mode"); }

let wakeLock = null;
const requestWakeLock = async () => { try { if ('wakeLock' in navigator) { if (wakeLock !== null) return; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (err) {} };
requestWakeLock();
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, requestWakeLock));

try {
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const session = doc(db, "sessions", "demo"); 
const peekSession = doc(db, "sessions", "peek"); 

await signInAnonymously(auth);
if(status) { status.textContent = "Connected."; status.style.color = "green"; }

if (mode === "magician") {
    document.getElementById("magician").hidden = false;
    const songInput = document.getElementById("song");
    const livePeekBox = document.getElementById("livePeekBox");

    let firstPeekSnap = true, lastSearchId = null;

    onSnapshot(peekSession, (snap) => {
        if(snap.exists()) {
            const data = snap.data();
            if(data.text !== undefined) livePeekBox.textContent = data.text !== "" ? data.text : "...";
            if (firstPeekSnap) { firstPeekSnap = false; lastSearchId = data.searchTrigger ? data.searchTrigger.id : null; return; }
            if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
                lastSearchId = data.searchTrigger.id;
                if(data.searchTrigger.platform === "youtube") {
                    window.location.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(data.searchTrigger.query);
                } else {
                    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(data.searchTrigger.query);
                }
            }
        }
    });

    const sendSongToAudience = async (urlText) => {
        if(urlText === "") return;
        let finalUrl = urlText;
        if (!finalUrl.startsWith("http") && !finalUrl.includes("youtube.com") && !finalUrl.includes("youtu.be") && !finalUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
            finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(finalUrl);
        } else if (!finalUrl.startsWith("http")) { finalUrl = "https://" + finalUrl; }

        try {
            await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true });
            status.textContent = `Song Sent! ✅`; status.style.color = "green"; songInput.value = ""; 
            if (navigator.vibrate) navigator.vibrate(300); 
            setTimeout(() => { window.location.href = finalUrl; }, 300);
        } catch (e) {}
    };

    document.getElementById("send").onclick = () => sendSongToAudience(songInput.value.trim());

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-IN'; recognition.continuous = false; recognition.interimResults = false;
        recognition.onstart = () => { if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]); status.textContent = "Listening... 🎙️"; status.style.color = "blue"; };
        recognition.onresult = (event) => { const transcript = event.results[0][0].transcript.trim(); songInput.value = transcript; sendSongToAudience(transcript); };
        const triggerMic = () => { try { recognition.start(); } catch(e) {} };
        const stopMic = () => { try { recognition.abort(); status.textContent = "Mic Stopped 🛑"; status.style.color = "red"; if (navigator.vibrate) navigator.vibrate([300, 100, 300]); setTimeout(() => { status.textContent = "Connected."; status.style.color = "green"; }, 2000); } catch(e) {} };

        let lastVolUpPress = 0, lastVolDownPress = 0;
        window.addEventListener('keydown', (e) => {
            if (e.key === "VolumeUp" || e.keyCode === 24) { let now = Date.now(); if (now - lastVolUpPress < 600) { e.preventDefault(); triggerMic(); } lastVolUpPress = now; }
            if (e.key === "VolumeDown" || e.keyCode === 25) { let now = Date.now(); if (now - lastVolDownPress < 600) { e.preventDefault(); stopMic(); } lastVolDownPress = now; }
        });
        let lastTap = 0, headingPressTimer;
        mainHeading.addEventListener('touchstart', (e) => { let now = Date.now(); if (now - lastTap < 400) { e.preventDefault(); triggerMic(); } lastTap = now; headingPressTimer = setTimeout(() => { stopMic(); }, 1500); });
        mainHeading.addEventListener('touchend', () => clearTimeout(headingPressTimer));
        mainHeading.addEventListener('touchcancel', () => clearTimeout(headingPressTimer));
    }

} else if (mode === "audience") {
// CHROME HOME NEW TAB UI WITH TWO-WAY SYNC

const googleSearchOverlay = document.getElementById("googleSearchOverlay");
const googleOverlayInput = document.getElementById("googleOverlayInput");
const googleSuggestions = document.getElementById("googleSuggestions");

document.getElementById("secretArmBtn").onclick = () => {
    document.getElementById("secretArmBtn").style.display = "none"; 
    let elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen().catch(err => {});
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(err => {});
}; 

document.getElementById("triggerGoogleSearchOverlay").addEventListener("click", () => {
    googleSearchOverlay.style.display = "flex";
    setTimeout(() => googleOverlayInput.focus(), 100);
});
document.getElementById("closeGoogleOverlay").addEventListener("click", () => { googleSearchOverlay.style.display = "none"; });

const triggerGoogleSearch = () => {
    let query = googleOverlayInput.value.trim();
    if (query !== "") {
        let uniqueId = Math.random().toString(36).substr(2, 9);
        setDoc(peekSession, { text: query, searchTrigger: { query: query, id: uniqueId, platform: "google" } }, { merge: true }).catch(err => {});
    }
};

googleOverlayInput.addEventListener("input", (e) => {
    let val = e.target.value;
    setDoc(peekSession, { text: val, time: Date.now() }, { merge: true }).catch(err => {});
    let trimVal = val.trim();
    if(trimVal.length > 0) {
        googleSuggestions.innerHTML = `
            <div class="g-sugg-item" data-val="${trimVal}"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--c-subtext);">🔍</span><span>${trimVal}</span></div><span style="color:var(--c-subtext); font-size:22px;">↖</span></div>
            <div class="g-sugg-item" data-val="${trimVal} song"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--c-subtext);">🔍</span><span>${trimVal} song</span></div><span style="color:var(--c-subtext); font-size:22px;">↖</span></div>
            <div class="g-sugg-item" data-val="${trimVal} video"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--c-subtext);">🔍</span><span>${trimVal} video</span></div><span style="color:var(--c-subtext); font-size:22px;">↖</span></div>
            <div class="g-sugg-item" data-val="${trimVal} lyrics"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--c-subtext);">🔍</span><span>${trimVal} lyrics</span></div><span style="color:var(--c-subtext); font-size:22px;">↖</span></div>
            <div class="g-sugg-item" data-val="${trimVal} download"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--c-subtext);">🔍</span><span>${trimVal} download</span></div><span style="color:var(--c-subtext); font-size:22px;">↖</span></div>
        `;
        document.querySelectorAll(".g-sugg-item").forEach(item => { item.addEventListener("click", function() { googleOverlayInput.value = this.getAttribute("data-val"); triggerGoogleSearch(); }); });
    } else { googleSuggestions.innerHTML = ""; }
});

document.getElementById("googleOverlayForm").addEventListener("submit", (e) => { e.preventDefault(); triggerGoogleSearch(); });

let firstPeekSnap = true, lastSearchId = null;
onSnapshot(peekSession, (snap) => {
    if(!snap.exists()) return;
    const data = snap.data();
    if(data.text !== undefined && document.activeElement !== googleOverlayInput) { googleOverlayInput.value = data.text; }
    if (firstPeekSnap) { firstPeekSnap = false; lastSearchId = data.searchTrigger ? data.searchTrigger.id : null; return; }
    if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
        lastSearchId = data.searchTrigger.id;
        document.body.innerHTML = ""; document.body.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--c-bg');
        window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(data.searchTrigger.query);
    }
});

let firstSessionSnap = true, lastSessionSeq = null;
onSnapshot(session, (snap) => {
    if (!snap.exists()) return;
    const data = snap.data(); 
    if (firstSessionSnap) { firstSessionSnap = false; lastSessionSeq = data.seq ?? null; return; } 
    if (data.seq == null || data.seq === lastSessionSeq) return;
    lastSessionSeq = data.seq; 

    document.body.innerHTML = ""; document.body.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--c-bg');
    if (data.songUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
        document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:black;"><img src="${data.songUrl}" style="width:100vw; height:100vh; object-fit:contain; pointer-events:none;"></div>`;
    } else { window.location.href = data.songUrl; } 
});

  </div>
  <div class="yt-content">
     <div class="yt-video"><div class="yt-thumb" style="background:url('https://picsum.photos/400/225?random=1') center/cover;"></div><div class="yt-details"><div class="yt-avatar"></div><div><div class="yt-title">Top 10 Amazing Facts You Didn't Know</div><div class="yt-meta">Fact Channel • 1.2M views • 2 weeks ago</div></div></div></div>
     <div class="yt-video"><div class="yt-thumb" style="background:url('https://picsum.photos/400/225?random=2') center/cover;"></div><div class="yt-details"><div class="yt-avatar"></div><div><div class="yt-title">Relaxing Music 24/7 Live Stream</div><div class="yt-meta">Chill Vibes • 15K watching</div></div></div></div>
  </div>
  <div class="yt-bottom-nav">
     <div class="yt-nav-item"><span style="font-size:20px;">🏠</span><span>Home</span></div>
     <div class="yt-nav-item"><span style="font-size:20px;">⚡</span><span>Shorts</span></div>
     <div class="yt-nav-item"><span style="font-size:28px; line-height:20px; font-weight:300;">⊕</span></div>
     <div class="yt-nav-item"><span style="font-size:20px;">📺</span><span>Subscriptions</span></div>
     <div class="yt-nav-item"><span style="font-size:20px;">👤</span><span>You</span></div>
  </div>
</div>

<!-- YOUTUBE SEARCH OVERLAY -->
<div id="ytSearchOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--yt-bg); z-index:10000; flex-direction:column;">
  <div style="display:flex; align-items:center; padding:10px 15px; gap:15px; border-bottom:1px solid var(--yt-border);">
     <span id="closeYtOverlay" style="font-size:24px; cursor:pointer;">←</span>
     <form id="overlaySearchForm" style="flex:1; display:flex; background:var(--yt-input-bg); border-radius:20px; padding:0 15px; height:36px; align-items:center;">
        <input type="search" id="overlayYtInput" placeholder="Search YouTube" style="width:100%; border:none; background:transparent; outline:none; font-size:16px; color:var(--yt-text);" autocomplete="off">
     </form>
     <div style="width:36px; height:36px; background:var(--yt-input-bg); border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:16px;">🎙️</div>
  </div>
  <div id="ytSuggestions" style="flex:1; padding:10px 0; overflow-y:auto;"></div>
</div>`;

const ytSearchOverlay = document.getElementById("ytSearchOverlay");
const overlayYtInput = document.getElementById("overlayYtInput");
const ytSuggestions = document.getElementById("ytSuggestions");

document.getElementById("secretYTArmBtn").onclick = () => {
    document.getElementById("secretYTArmBtn").style.display = "none"; 
    let elem = document.documentElement;
    if (elem.requestFullscreen) elem.requestFullscreen().catch(err => {});
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(err => {});
}; 

document.getElementById("triggerSearchOverlay").addEventListener("click", () => {
    ytSearchOverlay.style.display = "flex";
    setTimeout(() => overlayYtInput.focus(), 100);
});
document.getElementById("closeYtOverlay").addEventListener("click", () => { ytSearchOverlay.style.display = "none"; });

const triggerYTSearch = () => {
    let query = overlayYtInput.value.trim();
    if (query !== "") {
        let uniqueId = Math.random().toString(36).substr(2, 9);
        setDoc(peekSession, { text: query, searchTrigger: { query: query, id: uniqueId, platform: "youtube" } }, { merge: true }).catch(err => {});
    }
};

overlayYtInput.addEventListener("input", (e) => {
    let val = e.target.value;
    setDoc(peekSession, { text: val, time: Date.now() }, { merge: true }).catch(err => {});
    let trimVal = val.trim();
    if(trimVal.length > 0) {
        ytSuggestions.innerHTML = `
            <div class="yt-sugg-item" data-val="${trimVal}"><span style="font-size:18px;">🕒</span> ${trimVal}</div>
            <div class="yt-sugg-item" data-val="${trimVal} song"><span style="font-size:18px;">🕒</span> ${trimVal} song</div>
            <div class="yt-sugg-item" data-val="${trimVal} dj mix"><span style="font-size:18px;">🕒</span> ${trimVal} dj mix</div>
            <div class="yt-sugg-item" data-val="${trimVal} full video"><span style="font-size:18px;">🔍</span> ${trimVal} full video</div>
        `;
        document.querySelectorAll(".yt-sugg-item").forEach(item => { item.addEventListener("click", function() { overlayYtInput.value = this.getAttribute("data-val"); triggerYTSearch(); }); });
    } else { ytSuggestions.innerHTML = ""; }
});

document.getElementById("overlaySearchForm").addEventListener("submit", (e) => { e.preventDefault(); triggerYTSearch(); });

let firstPeekSnap = true, lastSearchId = null;
onSnapshot(peekSession, (snap) => {
    if(!snap.exists()) return;
    const data = snap.data();
    if(data.text !== undefined && document.activeElement !== overlayYtInput) { overlayYtInput.value = data.text; }
    if (firstPeekSnap) { firstPeekSnap = false; lastSearchId = data.searchTrigger ? data.searchTrigger.id : null; return; }
    if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
        lastSearchId = data.searchTrigger.id;
        document.body.innerHTML = ""; document.body.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--yt-bg');
        window.location.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(data.searchTrigger.query);
    }
});

let firstSessionSnap = true, lastSessionSeq = null;
onSnapshot(session, (snap) => {
    if (!snap.exists()) return;
    const data = snap.data();
    if (firstSessionSnap) { firstSessionSnap = false; lastSessionSeq = data.seq ?? null; return; }
    if (data.seq == null || data.seq === lastSessionSeq) return;
    lastSessionSeq = data.seq;

    document.body.innerHTML = ""; document.body.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--yt-bg');
    window.location.href = data.songUrl;
});

} else if (mode === "notepad") {
// NOTEPAD MODE WITH MAGIC LOGIC
document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%";
document.getElementById("notepadArea").hidden = false;

document.getElementById("notepadArea").innerHTML = `
<div style="width:100vw; height:100vh; background:#ffffff; display:flex; flex-direction:column; font-family:sans-serif; box-sizing:border-box;">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid #e0e0e0; background:#ffffff;">
    <div style="display:flex; align-items:center; gap:15px;">
      <span id="secretYT" style="font-size:24px; color:#5f6368; cursor:pointer; padding:5px 15px 5px 0; user-select:none;">←</span>
      <span id="secretTimer" style="font-size:20px; font-weight:500; color:#202124; padding:5px 15px 5px 0; user-select:none;">Notes</span>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
      <button id="secretGoogle" style="background:none; border:none; font-size:16px; font-weight:500; cursor:pointer; padding:5px 0; user-select:none;">Save</button>
    </div>
  </div>
  <div style="flex:1; padding:20px; display:flex; flex-direction:column; background:#ffffff;">
    <textarea id="fakeNote" style="width:100%; flex:1; border:none; outline:none; font-size:28px; font-weight:bold; line-height:1.6; color:#202124; background:#ffffff; resize:none;" placeholder="Start typing..."></textarea>
  </div>
</div>`; 

let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0;
let searchMode = localStorage.getItem("searchMode") || "2"; 
if(localStorage.getItem("isMagicianLive") === null) localStorage.setItem("isMagicianLive", "true");
let isMagicianLive = localStorage.getItem("isMagicianLive") === "true"; 
window.latestPeekText = ""; 

const noteBox = document.getElementById("fakeNote");
const secretYT = document.getElementById("secretYT");
const secretTimer = document.getElementById("secretTimer");
const secretGoogle = document.getElementById("secretGoogle"); 
if(secretGoogle) secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8"; 

let firstPeekSnap = true, lastSearchId = null;

onSnapshot(peekSession, (snap) => {
    if(snap.exists()) {
        const data = snap.data();
        if(data.text !== undefined && data.text !== null) { 
            window.latestPeekText = data.text; 
            if (isMagicianLive && noteBox) noteBox.value = data.text; 
        }
        if (firstPeekSnap) { firstPeekSnap = false; lastSearchId = data.searchTrigger ? data.searchTrigger.id : null; return; }
        if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
            lastSearchId = data.searchTrigger.id;
            if(data.searchTrigger.platform === "youtube") {
                window.location.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(data.searchTrigger.query);
            } else {
                window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(data.searchTrigger.query);
            }
        }
    }
});

let lastText = "", prevLength = 0;
function addLongPress(element, callback) {
  if(!element) return;
  let pressTimer, fired = false;
  const start = (e) => { fired = false; pressTimer = setTimeout(() => { fired = true; callback(); }, 1500); };
  const cancel = () => { clearTimeout(pressTimer); };
  element.addEventListener("touchstart", start, {passive: true});
  element.addEventListener("touchend", (e) => { clearTimeout(pressTimer); if(fired && e.cancelable) e.preventDefault(); });
  element.addEventListener("mousedown", start);
  element.addEventListener("mouseup", (e) => { clearTimeout(pressTimer); if(fired && e.cancelable) e.preventDefault(); });
  element.addEventListener("mouseleave", cancel);
} 

if(secretGoogle) {
    addLongPress(secretGoogle, () => {
        isMagicianLive = !isMagicianLive; localStorage.setItem("isMagicianLive", isMagicianLive);
        secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8";
        if (navigator.vibrate) navigator.vibrate(isMagicianLive ? [100, 50, 100] : [100]);
        if (isMagicianLive) { if(noteBox) noteBox.value = window.latestPeekText; } else { if(noteBox) noteBox.value = ""; lastText = ""; prevLength = 0; }
    });
    secretGoogle.addEventListener("click", (e) => {
        if (noteBox && noteBox.value.trim().length > 0) { triggerMagic(noteBox.value.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; }
    }); 
}

addLongPress(secretYT, () => { searchMode = searchMode === "1" ? "2" : "1"; localStorage.setItem("searchMode", searchMode); if (navigator.vibrate) navigator.vibrate(200); }); 
addLongPress(secretTimer, () => {
  let t = prompt("Timer (sec):", magicDelay);
  if (t !== null && t.trim() !== "") { let seconds = parseInt(t); if (!isNaN(seconds)) { magicDelay = seconds; localStorage.setItem("magicDelay", magicDelay); if (navigator.vibrate) navigator.vibrate(50); } }
}); 
addLongPress(noteBox, () => {
    if (navigator.vibrate) navigator.vibrate([50, 50]); 
    if(noteBox) noteBox.value = ""; lastText = ""; prevLength = 0; window.latestPeekText = "";
    setDoc(peekSession, { text: "", time: Date.now() }, { merge: true }).catch(()=>{});
});

if(noteBox) {
    noteBox.addEventListener("input", () => {
        if(isMagicianLive) return; 
        let currentText = noteBox.value;
        if (currentText === "" && lastText.trim().length > 0) { triggerMagic(lastText.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; } 
        else { if (currentText.length > prevLength) { lastText = currentText.trim(); } prevLength = currentText.length; }
    }); 
    noteBox.addEventListener("keydown", (e) => {
        if(isMagicianLive) return; 
        if (e.key === "Enter") { e.preventDefault(); if (noteBox.value.trim().length > 0) { triggerMagic(noteBox.value.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; } }
    }); 
}

function triggerMagic(textToSearch) {
  let finalUrl = "", lowerText = textToSearch.toLowerCase(), timeToWait = magicDelay * 1000, suit = "", value = "";
  if(lowerText.includes("hukum") || lowerText.includes("spade") || lowerText.includes("हुकुम")) suit = "S";
  else if(lowerText.includes("paan") || lowerText.includes("heart") || lowerText.includes("पान")) suit = "H";
  else if(lowerText.includes("chidi") || lowerText.includes("club") || lowerText.includes("चिड़ी")) suit = "C";
  else if(lowerText.includes("eet") || lowerText.includes("diamond") || lowerText.includes("ईंट")) suit = "D";
  if(lowerText.includes("ikka") || lowerText.includes("ace")) value = "A";
  else if(lowerText.includes("badshah") || lowerText.includes("king")) value = "K";
  else if(lowerText.includes("begum") || lowerText.includes("queen")) value = "Q";
  else if(lowerText.includes("gulam") || lowerText.includes("jack")) value = "J";
  else if(lowerText.includes("10") || lowerText.includes("दस")) value = "0"; 
  else { for(let i=2; i<=9; i++) { if(lowerText.includes(i.toString())) value = i.toString(); } }

  if (suit !== "" && value !== "") { finalUrl = "https://deckofcardsapi.com/static/img/" + value + suit + ".png"; } 
  else if (searchMode === "2") { finalUrl = "https://www.google.com/search?q=" + encodeURIComponent(textToSearch); } 
  else { finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(textToSearch); }

  setTimeout(async () => { try { await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true }); } catch (err) {} }, timeToWait);
} 

} else if (mode === "deck") {
// DECK MODE
document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%";
document.getElementById("deckArea").hidden = false;
let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0; 
if (localStorage.getItem("autoDeckSend") === null) localStorage.setItem("autoDeckSend", "true");
let autoDeckSend = localStorage.getItem("autoDeckSend") === "true";

const suits = ["S", "H", "C", "D"], values = ["A", "2", "3", "4", "5", "6", "7", "8", "9", "0", "J", "Q", "K"];
let deck = [];
for(let s of suits) { for(let v of values) { deck.push(v + s); } }
for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }

onSnapshot(peekSession, (snap) => {
    if(snap.exists()) {
        const data = snap.data();
        if(data.text !== undefined && data.text.trim() !== "") {
            let pk = document.getElementById("deckPeekText");
            if(!pk) { pk = document.createElement("div"); pk.id = "deckPeekText"; pk.style.cssText = "position:absolute; top:10px; left:15px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:bold; z-index:9999; pointer-events:none;"; document.body.appendChild(pk); }
            pk.textContent = data.text;
        }
    }
});

function renderDeckUI() {
    document.body.style.backgroundColor = "#0f4d0f"; 
    document.getElementById("deckArea").innerHTML = `<div style="width: 100vw; height: 100vh; background: #0f4d0f; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; box-sizing: border-box; overflow: hidden; position: relative;"><div id="secretAutoToggle" style="position: absolute; top: 0; right: 0; width: 60px; height: 60px; background: transparent; z-index: 100;"></div><div id="deckContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 400px; overflow-y: auto; padding-bottom: 20px; height: 100%;"></div></div>`;
    renderDeckCards();
    const toggleBtn = document.getElementById("secretAutoToggle");
    if(toggleBtn) {
        let toggleTimer;
        const startToggle = (e) => { e.preventDefault(); toggleTimer = setTimeout(() => { autoDeckSend = !autoDeckSend; localStorage.setItem("autoDeckSend", autoDeckSend); if (navigator.vibrate) navigator.vibrate(autoDeckSend ? [100, 100, 100] : 300); }, 2000); };
        const cancelToggle = () => { clearTimeout(toggleTimer); };
        toggleBtn.addEventListener("touchstart", startToggle); toggleBtn.addEventListener("touchend", cancelToggle);
        toggleBtn.addEventListener("mousedown", startToggle); toggleBtn.addEventListener("mouseup", cancelToggle);
    }
}

function renderDeckCards() {
    let html = "";
    for(let i=0; i<52; i++) { html += `<img class="card-face" data-index="${i}" src="https://deckofcardsapi.com/static/img/${deck[i]}.png" style="width: 50px; height: 72px; border-radius: 4px; box-shadow: 1px 2px 5px rgba(0,0,0,0.5); margin-bottom: 5px; cursor: pointer; touch-action: manipulation;">`; }
    const deckContainer = document.getElementById("deckContainer");
    if(deckContainer) {
        deckContainer.innerHTML = html;
        document.querySelectorAll(".card-face").forEach(card => {
            let lastTap = 0;
            card.addEventListener("click", function(e) {
                let tapLength = new Date().getTime() - lastTap;
                if (tapLength < 400 && tapLength > 0) { selectCard(deck[this.getAttribute("data-index")]); e.preventDefault(); }
                lastTap = new Date().getTime();
            });
        });
    }
}

function selectCard(cardCode) {
    const finalUrl = "https://deckofcardsapi.com/static/img/" + cardCode + ".png";
    document.body.style.backgroundColor = "#000000"; 
    document.getElementById("deckArea").innerHTML = `<div style="width: 100vw; height: 100vh; background: #000000; display: flex; align-items: center; justify-content: center; position: relative;"><button id="backToDeck" style="position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 16px; z-index: 10;">← Back</button><img src="${finalUrl}" style="width: 100vw; height: 100vh; object-fit: contain;"><div id="secretBottomRight" style="position: absolute; bottom: 0; right: 0; width: 80px; height: 80px; z-index: 10;"></div></div>`;
    document.getElementById("backToDeck").addEventListener("click", () => renderDeckUI());
    const sendCardToAudience = () => { setTimeout(async () => { try { await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true }); } catch (err) {} }, magicDelay * 1000); };
    if (autoDeckSend) sendCardToAudience();
    const secretTrigger = document.getElementById("secretBottomRight");
    if(secretTrigger) {
        let pressTimer;
        const startPress = (e) => { e.preventDefault(); pressTimer = setTimeout(() => { if (navigator.vibrate) navigator.vibrate(100); sendCardToAudience(); }, 2000); };
        secretTrigger.addEventListener("touchstart", startPress); secretTrigger.addEventListener("touchend", () => clearTimeout(pressTimer));
        secretTrigger.addEventListener("mousedown", startPress); secretTrigger.addEventListener("mouseup", () => clearTimeout(pressTimer));
    }
}
renderDeckUI();

} else {
status.innerHTML = 'Choose a mode: <br><br> <a href="?mode=magician">Magician</a> | <a href="?mode=audience">Google Chrome</a> | <a href="?mode=youtube">YouTube</a> | <a href="?mode=notepad">Notepad</a> | <a href="?mode=deck">Deck</a>';
status.style.color = "black";
} 

} catch (e) {
status.innerHTML = "<b>System Error:</b> " + e.message;
status.style.color = "red";
}
</script>
</body>
