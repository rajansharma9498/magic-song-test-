  try {
    if ('wakeLock' in navigator) {
      if (wakeLock !== null) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (err) {}
};

  if (document.visibilityState === 'visible') await requestWakeLock();
});

document.addEventListener('touchstart', requestWakeLock);

        if(urlText === "") return;

                updatedAt: serverTimestamp()

        const recognition = new SpeechRecognition();

            if (navigator.vibrate) navigator.vibrate([50, 100, 50, 100, 50]); 
            status.textContent = "Listening... 🎙️ (Volume Down x2 to Cancel)";

            status.textContent = "Voice failed. Try again.";

            try { recognition.start(); } catch(e) {}
        };

            try { 
                recognition.abort(); 
                status.textContent = "Mic Stopped 🛑";
                status.style.color = "red";
                if (navigator.vibrate) navigator.vibrate([300, 100, 300]); 
                setTimeout(() => { status.textContent = "Connected."; status.style.color = "green"; }, 2000);

        let lastVolDownPress = 0;

            if (e.key === "VolumeUp" || e.key === "AudioVolumeUp" || e.keyCode === 24) {
                let now = Date.now();
                if (now - lastVolUpPress < 600) { 
                    e.preventDefault(); 
                    triggerMic();
                }
                lastVolUpPress = now;
            }
            if (e.key === "VolumeDown" || e.key === "AudioVolumeDown" || e.keyCode === 25) {
                let now = Date.now();
                if (now - lastVolDownPress < 600) { 
                    e.preventDefault(); 
                    stopMic();
                }
                lastVolDownPress = now;
            }
        });

        let lastTap = 0;
        let headingPressTimer;
        
        mainHeading.addEventListener('touchstart', (e) => {
            let now = Date.now();
            if (now - lastTap < 400) { 
                e.preventDefault();
                triggerMic();
            }
            lastTap = now;
            
            headingPressTimer = setTimeout(() => {
                stopMic();
            }, 1500);
        });
        
        mainHeading.addEventListener('touchend', () => {
            clearTimeout(headingPressTimer); 
        });

    setDoc(peekSession, { text: val, time: Date.now() }, { merge: true }).catch(err => {});
};

  </div>
  <div style="flex: 1; padding: 20px; display: flex; flex-direction: column; background: #ffffff; position: relative;">
    <textarea id="fakeNote" style="width: 100%; flex: 1; border: none; outline: none; font-size: 28px; font-weight: bold; line-height: 1.6; color: #202124; background: #ffffff; resize: none;" placeholder="Start typing..."></textarea>
  </div>
</div>`; 

let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0;
let searchMode = localStorage.getItem("searchMode") || "2"; 

if(localStorage.getItem("isMagicianLive") === null) {
    localStorage.setItem("isMagicianLive", "true");
}
let isMagicianLive = localStorage.getItem("isMagicianLive") === "true"; 
window.latestPeekText = ""; 

const noteBox = document.getElementById("fakeNote");
const secretYT = document.getElementById("secretYT");
const secretTimer = document.getElementById("secretTimer");
const secretGoogle = document.getElementById("secretGoogle"); 

if(secretGoogle) {
    secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8"; 
}

// 1. Live Receiver
onSnapshot(peekSession, (snap) => {
    if(snap.exists()) {
        const data = snap.data();
        if(data.text !== undefined && data.text !== null) { 
            window.latestPeekText = data.text; 
            if (isMagicianLive && noteBox) {
                noteBox.value = data.text; 
            }
        }
    }
});

let lastText = "";
let prevLength = 0;

function addLongPress(element, callback) {
if(!element) return;
let pressTimer;
let fired = false;
const start = (e) => { 
    fired = false;
    pressTimer = setTimeout(() => {
        fired = true;
        callback();
    }, 1500); 
};
const cancel = () => { clearTimeout(pressTimer); };
element.addEventListener("touchstart", start, {passive: true});
element.addEventListener("touchend", (e) => {
    clearTimeout(pressTimer);
    if(fired && e.cancelable) e.preventDefault();
});
element.addEventListener("mousedown", start);
element.addEventListener("mouseup", (e) => {
    clearTimeout(pressTimer);
    if(fired && e.cancelable) e.preventDefault();
});
element.addEventListener("mouseleave", cancel);
} 

// 2. LONG PRESS on Save Button - Toggles Mode
if(secretGoogle) {
    addLongPress(secretGoogle, () => {
        isMagicianLive = !isMagicianLive;
        localStorage.setItem("isMagicianLive", isMagicianLive);
        secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8";
        if (navigator.vibrate) navigator.vibrate(isMagicianLive ? [100, 50, 100] : [100]);
        
        if (isMagicianLive) {
            if(noteBox) noteBox.value = window.latestPeekText;
        } else {
            if(noteBox) noteBox.value = "";
            lastText = "";
            prevLength = 0;
        }
    });
    
    secretGoogle.addEventListener("click", (e) => {
        if (noteBox && noteBox.value.trim().length > 0) {
            triggerMagic(noteBox.value.trim());
            noteBox.value = "";
            lastText = "";
            prevLength = 0;
        }
    }); 
}

addLongPress(secretYT, () => {
searchMode = searchMode === "1" ? "2" : "1";
localStorage.setItem("searchMode", searchMode);
if (navigator.vibrate) navigator.vibrate(200);
}); 

addLongPress(secretTimer, () => {
let t = prompt("Timer (sec):", magicDelay);
if (t !== null && t.trim() !== "") {
let seconds = parseInt(t);
if (!isNaN(seconds)) {
magicDelay = seconds;
localStorage.setItem("magicDelay", magicDelay);
if (navigator.vibrate) navigator.vibrate(50);
}
}
}); 

// 3. Clear Screen Safely (Long Press on Notepad)
addLongPress(noteBox, () => {
    if (navigator.vibrate) navigator.vibrate([50, 50]); 
    if(noteBox) noteBox.value = "";
    lastText = "";
    prevLength = 0;
    window.latestPeekText = "";
    setDoc(peekSession, { text: "", time: Date.now() }, { merge: true }).catch(()=>{});
});

// 4. Backspace Trigger (Blue Mode Only)
if(noteBox) {
    noteBox.addEventListener("input", () => {
        if(isMagicianLive) return; 

        let currentText = noteBox.value;
        
        if (currentText === "" && lastText.trim().length > 0) {
            triggerMagic(lastText.trim()); 
            noteBox.value = ""; 
            lastText = "";
            prevLength = 0;
        } else {
            if (currentText.length > prevLength) {
                lastText = currentText.trim();
            }
            prevLength = currentText.length;
        }
    }); 
    
    noteBox.addEventListener("keydown", (e) => {
        if(isMagicianLive) return; 
        if (e.key === "Enter") {
            e.preventDefault();
            if (noteBox.value.trim().length > 0) {
                triggerMagic(noteBox.value.trim());
                noteBox.value = "";
                lastText = "";
                prevLength = 0;
            }
        }
    }); 
}

function triggerMagic(textToSearch) {
let finalUrl = "";
let lowerText = textToSearch.toLowerCase();
let timeToWait = magicDelay * 1000;
let suit = "";
let value = "";

if(lowerText.includes("hukum") || lowerText.includes("spade") || lowerText.includes("हुकुम")) suit = "S";
else if(lowerText.includes("paan") || lowerText.includes("heart") || lowerText.includes("पान")) suit = "H";
else if(lowerText.includes("chidi") || lowerText.includes("club") || lowerText.includes("चिड़ी") || lowerText.includes("chidiya")) suit = "C";
else if(lowerText.includes("eet") || lowerText.includes("diamond") || lowerText.includes("dimond") || lowerText.includes("ईंट")) suit = "D";

if(lowerText.includes("ikka") || lowerText.includes("ace") || lowerText.includes("इक्का")) value = "A";
else if(lowerText.includes("badshah") || lowerText.includes("king") || lowerText.includes("बादशाह")) value = "K";
else if(lowerText.includes("begum") || lowerText.includes("queen") || lowerText.includes("बेगम")) value = "Q";
else if(lowerText.includes("gulam") || lowerText.includes("jack") || lowerText.includes("गुलाम")) value = "J";
else if(lowerText.includes("10") || lowerText.includes("दस")) value = "0"; 
else {
for(let i=2; i<=9; i++) {
if(lowerText.includes(i.toString())) value = i.toString();
}
}

if (suit !== "" && value !== "") {
finalUrl = "https://deckofcardsapi.com/static/img/" + value + suit + ".png"; 
} else if (searchMode === "2") {
finalUrl = "https://www.google.com/search?q=" + encodeURIComponent(textToSearch);
} else {
finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(textToSearch);
}

setTimeout(async () => {
try {
await setDoc(session, {
songUrl: finalUrl,
seq: Date.now(),
updatedAt: serverTimestamp()
}, { merge: true });
} catch (err) {}
}, timeToWait);
} 

} else if (mode === "deck") {
document.body.style.margin = "0";
document.body.style.padding = "0";
document.body.style.maxWidth = "100%";

let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0; 

if (localStorage.getItem("autoDeckSend") === null) {
    localStorage.setItem("autoDeckSend", "true");
}
let autoDeckSend = localStorage.getItem("autoDeckSend") === "true";

const suits = ["S", "H", "C", "D"];
const values = ["A", "2", "3", "4", "5", "6", "7", "8", "9", "0", "J", "Q", "K"];
let deck = [];
for(let s of suits) {
    for(let v of values) {
        deck.push(v + s);
    }
}
for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
}

onSnapshot(peekSession, (snap) => {
    if(snap.exists()) {
        const data = snap.data();
        if(data.text !== undefined && data.text.trim() !== "") {
            let pk = document.getElementById("deckPeekText");
            if(!pk) {
                pk = document.createElement("div");
                pk.id = "deckPeekText";
                pk.style.cssText = "position:absolute; top:10px; left:15px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:bold; z-index:9999; pointer-events:none;";
                document.body.appendChild(pk);
            }
            pk.textContent = data.text;
        }
    }
});

function renderDeckUI() {
    document.body.style.backgroundColor = "#0f4d0f"; 
    document.body.innerHTML = `
    <div style="width: 100vw; height: 100vh; background: #0f4d0f; display: flex; flex-direction: column; align-items: center; padding: 25px 15px; box-sizing: border-box; overflow: hidden; font-family: sans-serif; position: relative;">
      <div id="secretAutoToggle" style="position: absolute; top: 0; right: 0; width: 60px; height: 60px; background: transparent; z-index: 100;"></div>
      <div id="deckContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 400px; overflow-y: auto; padding-bottom: 20px; height: 100%;"></div>
    </div>
    `;
    renderDeckCards();
    
    const toggleBtn = document.getElementById("secretAutoToggle");
    if(toggleBtn) {
        let toggleTimer;
        const startToggle = (e) => { 
            e.preventDefault(); 
            toggleTimer = setTimeout(() => {
                autoDeckSend = !autoDeckSend;
                localStorage.setItem("autoDeckSend", autoDeckSend);
                if (navigator.vibrate) {
                    if(autoDeckSend) navigator.vibrate([100, 100, 100]); 
                    else navigator.vibrate(300); 
                }
            }, 2000); 
        };
        const cancelToggle = () => { clearTimeout(toggleTimer); };
        toggleBtn.addEventListener("touchstart", startToggle);
        toggleBtn.addEventListener("touchend", cancelToggle);
        toggleBtn.addEventListener("mousedown", startToggle);
        toggleBtn.addEventListener("mouseup", cancelToggle);
        toggleBtn.addEventListener("mouseleave", cancelToggle);
    }
}

function renderDeckCards() {
    let html = "";
    for(let i=0; i<52; i++) {
        let cardUrl = "https://deckofcardsapi.com/static/img/" + deck[i] + ".png";
        html += `<img class="card-face" data-index="${i}" src="${cardUrl}" style="width: 50px; height: 72px; border-radius: 4px; box-shadow: 1px 2px 5px rgba(0,0,0,0.5); margin-bottom: 5px; cursor: pointer; touch-action: manipulation;">`;
    }
    const deckContainer = document.getElementById("deckContainer");
    if(deckContainer) {
        deckContainer.innerHTML = html;
        const cards = document.querySelectorAll(".card-face");
        cards.forEach(card => {
            let lastTap = 0;
            card.addEventListener("click", function(e) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                if (tapLength < 400 && tapLength > 0) {
                    const idx = this.getAttribute("data-index");
                    selectCard(deck[idx]);
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
        });
    }
}

function selectCard(cardCode) {
    const finalUrl = "https://deckofcardsapi.com/static/img/" + cardCode + ".png";
    document.body.style.backgroundColor = "#000000"; 
    document.body.innerHTML = `
    <div style="width: 100vw; height: 100vh; background: #000000; display: flex; align-items: center; justify-content: center; position: relative;">
        <button id="backToDeck" style="position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; z-index: 10;">← Back</button>
        <img src="${finalUrl}" style="width: 100vw; height: 100vh; object-fit: contain;">
        <div id="secretBottomRight" style="position: absolute; bottom: 0; right: 0; width: 80px; height: 80px; background: transparent; z-index: 10;"></div>
    </div>
    `;
    
    const backToDeck = document.getElementById("backToDeck");
    if(backToDeck) {
        backToDeck.addEventListener("click", () => {
            renderDeckUI();
        });
    }

    const sendCardToAudience = () => {
        let timeToWait = magicDelay * 1000;
        setTimeout(async () => {
            try {
                await setDoc(session, {
                    songUrl: finalUrl,
                    seq: Date.now(),
                    updatedAt: serverTimestamp()
                }, { merge: true });
            } catch (err) {}
        }, timeToWait);
    };

    if (autoDeckSend) sendCardToAudience();

    const secretTrigger = document.getElementById("secretBottomRight");
    if(secretTrigger) {
        let pressTimer;
        const startPress = (e) => { 
            e.preventDefault(); 
            pressTimer = setTimeout(() => {
                if (navigator.vibrate) navigator.vibrate(100);
                sendCardToAudience();
            }, 2000); 
        };
        const cancelPress = () => { clearTimeout(pressTimer); };
        secretTrigger.addEventListener("touchstart", startPress);
        secretTrigger.addEventListener("touchend", cancelPress);
        secretTrigger.addEventListener("mousedown", startPress);
        secretTrigger.addEventListener("mouseup", cancelPress);
        secretTrigger.addEventListener("mouseleave", cancelPress);
    }
}

renderDeckUI();

} else {
status.innerHTML = 'Choose a mode: <a href="?mode=magician">Magician</a> | <a href="?mode=audience">Audience</a> | <a href="?mode=notepad">Notepad</a> | <a href="?mode=deck">Digital Deck</a>';
status.style.color = "black";
} 

} catch (e) {
status.innerHTML = "<b>System Error:</b> " + e.message;
status.style.color = "red";
}
</script>
</body>
</html>
