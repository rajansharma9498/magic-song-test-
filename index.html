<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"; 

const firebaseConfig = {
apiKey: "AIzaSyAQZOb24fPqKZ_yjT6gMdjy1y4SMubqQQU",
authDomain: "magicsong-80310.firebaseapp.com",
projectId: "magicsong-80310",
storageBucket: "magicsong-80310.firebasestorage.app",
messagingSenderId: "719524639159",
appId: "1:719524639159:web:6ad56586cc7671c29e7832"
}; 

function addLongPress(element, callback) {
    if(!element) return;
    let pressTimer, fired = false;
    const start = (e) => { fired = false; pressTimer = setTimeout(() => { fired = true; callback(); }, 2000); };
    const cancel = () => { clearTimeout(pressTimer); };
    element.addEventListener("touchstart", start, {passive: true});
    element.addEventListener("touchend", (e) => { clearTimeout(pressTimer); if(fired && e.cancelable) e.preventDefault(); });
    element.addEventListener("mousedown", start);
    element.addEventListener("mouseup", (e) => { clearTimeout(pressTimer); if(fired && e.cancelable) e.preventDefault(); });
    element.addEventListener("mouseleave", cancel);
}

let mode = new URLSearchParams(location.search).get("mode");
if (mode) { sessionStorage.setItem("magic_app_mode", mode); } 
else { mode = sessionStorage.getItem("magic_app_mode"); }

const crashScreen = document.getElementById("crashScreen");
const modeSelector = document.getElementById("modeSelector");

if (!mode) {
    crashScreen.style.display = "flex";
    addLongPress(crashScreen, () => {
        if(navigator.vibrate) navigator.vibrate(50);
        crashScreen.style.display = "none";
        modeSelector.hidden = false;
    });
}

let wakeLock = null;
const requestWakeLock = async () => { try { if ('wakeLock' in navigator) { if (wakeLock !== null) return; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (err) {} };
requestWakeLock();
['click','touchstart','keydown'].forEach(evt => document.addEventListener(evt, requestWakeLock));

try {
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const session = doc(db, "sessions", "demo"); 
const peekSession = doc(db, "sessions", "peek"); 

await signInAnonymously(auth);

// =====================================
// MAGICIAN MODE
// =====================================
if (mode === "magician") {
    document.getElementById("magician").hidden = false;
    const songInput = document.getElementById("song");
    const livePeekBox = document.getElementById("livePeekBox");
    const sendBtn = document.getElementById("sendBtn");
    const hiddenMicTrigger = document.getElementById("hiddenMicTrigger");

    let isInitialSnap = true;
    let lastSearchId = null;

    onSnapshot(peekSession, (snap) => {
        if(snap.exists()) {
            const data = snap.data();
            if(data.text !== undefined) livePeekBox.textContent = data.text !== "" ? data.text : "";
            
            // Magician auto-redirect feature
            if(isInitialSnap) {
                isInitialSnap = false;
                if(data.searchTrigger) lastSearchId = data.searchTrigger.id;
                return;
            }
            if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
                lastSearchId = data.searchTrigger.id;
                let url = data.searchTrigger.platform === 'google' 
                    ? "https://www.google.com/search?q=" + encodeURIComponent(data.searchTrigger.query)
                    : "https://www.youtube.com/results?search_query=" + encodeURIComponent(data.searchTrigger.query);
                window.open(url, '_blank');
            }
        }
    });

    const sendSongToAudience = async (urlText) => {
        if(urlText === "") return;
        let finalUrl = urlText;
        if (!finalUrl.startsWith("http") && !finalUrl.includes("youtube.com") && !finalUrl.includes("youtu.be") && !finalUrl.match(/\.(jpeg|jpg|gif|png|webp)/i)) {
            finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(finalUrl);
        } else if (!finalUrl.startsWith("http")) { finalUrl = "https://" + finalUrl; }

        try {
            await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true });
            songInput.value = ""; 
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
        } catch (e) {}
    };

    let isListening = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-IN'; 
        recognition.continuous = true; 
        recognition.interimResults = true; 
        
        const toggleMic = () => {
            if (isListening) {
                try { recognition.stop(); } catch(e){}
                isListening = false;
                sendBtn.style.background = "#1a73e8";
                sendBtn.textContent = "Send";
                if(navigator.vibrate) navigator.vibrate([50, 50]);
            } else {
                try { recognition.start(); } catch(e){}
                isListening = true;
                sendBtn.style.background = "#d32f2f";
                sendBtn.textContent = "Listening...";
                if(navigator.vibrate) navigator.vibrate(50);
            }
        };

        document.addEventListener('keydown', (e) => {
            if(e.key === "VolumeUp" || e.key === "VolumeDown" || e.key === "AudioVolumeUp" || e.key === "AudioVolumeDown") {
                e.preventDefault(); toggleMic();
            }
        });
        
        hiddenMicTrigger.addEventListener("click", () => { toggleMic(); });

        recognition.onresult = (event) => { 
            let finalTrans = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) finalTrans += event.results[i][0].transcript;
            }
            if(finalTrans.trim() !== "") { songInput.value = finalTrans.trim(); }
        };
        
        recognition.onend = () => {
            if(isListening) { try { recognition.start(); } catch(e){} } 
        };

        sendBtn.addEventListener("click", () => {
            if (songInput.value.trim() !== "") {
                sendSongToAudience(songInput.value.trim());
                if(isListening) toggleMic();
            } else {
                toggleMic();
            }
        });
    } else {
        sendBtn.addEventListener("click", () => {
            if (songInput.value.trim() !== "") sendSongToAudience(songInput.value.trim());
        });
    }

    songInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendSongToAudience(songInput.value.trim());
        }
    });

}

    `;

    document.getElementById("galleryArea").innerHTML = `
    <div class="gal-wrapper">
        <div class="gal-header"><div class="gal-search"><span>🔍</span> Search</div><div style="width:32px; height:32px; border-radius:50%; background:url('https://picsum.photos/50/50') center/cover;"></div></div>
        <div class="gal-tabs"><div class="gal-tab active">Photos</div><div class="gal-tab">Memories</div><div class="gal-tab">Library</div></div>
        <div class="gal-content">

    <div class="fs-viewer" id="fsViewer">

        </div>
    </div>
    `;

    const d = new Date();
    d.setDate(d.getDate() - 2);
    const m = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById("twoDaysAgoText").innerText = d.getDate() + " " + m[d.getMonth()];

    const yesterdayGrid = document.getElementById("yesterdayGrid");
    const fsViewer = document.getElementById("fsViewer");
    const fsImgContainer = document.getElementById("fsImgContainer");
    let currentThumb = null;

    window.addEventListener('popstate', (e) => {
        if (fsViewer.style.display === "flex") {
            fsViewer.style.display = "none";
        }
    });

    const openViewer = () => {
        fsViewer.style.display = "flex";
        history.pushState({fsOpen: true}, "");
    };

    document.getElementById("fsDeleteBtn").onclick = () => { 
        if(confirm("Move to Trash?")) { 
            if(currentThumb) currentThumb.remove(); 
            history.back(); 
        } 
    };

    document.querySelectorAll('.static-img').forEach(item => {
        item.onclick = () => {
            currentThumb = item;
            const bgUrl = item.style.backgroundImage;
            fsImgContainer.innerHTML = '<div style="width:100%; height:100%; background-size:contain; background-repeat:no-repeat; background-position:center;"></div>';
            fsImgContainer.firstChild.style.backgroundImage = bgUrl;
            openViewer();
        };
    });

    let lastSearchId = null;
    onSnapshot(peekSession, (snap) => {
        if(!snap.exists()) return;
        const data = snap.data();
        if(data.searchTrigger && data.searchTrigger.id !== lastSearchId) {
            lastSearchId = data.searchTrigger.id;
            const query = data.searchTrigger.query;
            const newThumb = document.createElement("div");
            newThumb.className = "gal-item fake-paper";
            newThumb.innerHTML = `<div class="fake-text" style="font-size:18px;">${query}</div>`;
            newThumb.onclick = () => {
                currentThumb = newThumb;
                fsImgContainer.innerHTML = `<div class="fake-paper" style="width:100%; height:100%; max-width:500px; max-height:500px; margin:auto;"><div class="fake-text" style="font-size:48px;">${query}</div></div>`;
                openViewer();
            };
            yesterdayGrid.insertBefore(newThumb, yesterdayGrid.firstChild);
        }
    });

} 
// =====================================

// =====================================
else if (mode === "audience") {
    window.history.replaceState({}, document.title, window.location.pathname);
    document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%"; 
    document.getElementById("globalStyles").innerHTML = `
    :root { --c-bg:#202124; --c-text:#e8eaed; --c-subtext:#9aa0a6; --c-surface:#303134; --c-surface-hover:#3c4043; --c-border:#5f6368; }

    `;
    
    // Dynamic Chrome Feed Generator
    const chromeNews = [
        {t: "India's new space mission launch date confirmed", s: "ISRO Official", d: "2 hours ago"},
        {t: "Top 10 upcoming smartphones in late 2026", s: "Tech Radar", d: "5 hours ago"},
        {t: "Stock market updates: Sensex reaches new all-time high", s: "MoneyControl", d: "Yesterday"},

    let feedHtml = "";
    chromeNews.forEach((news, idx) => {
        feedHtml += `

            <div style="flex:1;">
                <div class="c-card-title">${news.t}</div>
                <div class="c-card-meta">
                    <div style="display:flex; align-items:center; gap:8px;">

        </div>`;
    });

    document.getElementById("audience").hidden = false;
    document.getElementById("audience").innerHTML = `
    <div id="secretArmBtn" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999; cursor:pointer;"></div>
    
    <div class="c-wrapper" id="chromeMainUI">
        <div class="c-header">
            <span style="font-size:24px; color:var(--c-subtext);">⌂</span>

            setDoc(peekSession, { text: query, searchTrigger: { query: query, id: uniqueId, platform: "youtube" } }, { merge: true }).catch(err => {});
            
            // Navigate internally instead of external URL
            history.back(); // close overlay
            setTimeout(() => {
                history.pushState({searchResult: true}, "");
                renderFakeYtResults(query);
            }, 50);
        }
    };

    window.showYtSuggestions = function(data) {
        let suggestions = data[1] || [];
        let html = "";
        suggestions.forEach(sugg => {
            let suggText = Array.isArray(sugg) ? sugg[0] : sugg;
            html += `<div class="yt-sugg-item" data-val="${suggText}"><div style="display:flex; align-items:center; gap:15px;"><span style="color:var(--yt-subtext);">🔍</span><span>${suggText}</span></div><span style="color:var(--yt-subtext); font-size:22px;">↖</span></div>`;
        });
        document.getElementById("ytSuggestions").innerHTML = html;
        document.querySelectorAll(".yt-sugg-item").forEach(item => { 
            item.addEventListener("click", function() { 
                overlayYtInput.value = this.getAttribute("data-val"); 
                triggerYTSearch(); 
            }); 
        });
    };

    overlayYtInput.addEventListener("input", (e) => {
        let val = e.target.value; setDoc(peekSession, { text: val, time: Date.now() }, { merge: true }).catch(err => {});
        let trimVal = val.trim();
        
        if (val.length > 0) { clearYtInput.style.display = "block"; } 
        else { clearYtInput.style.display = "none"; ytSuggestions.innerHTML = ""; }

        if(trimVal.length > 0) {
            let script = document.createElement("script");
            script.src = "https://suggestqueries.google.com/complete/search?client=youtube&q=" + encodeURIComponent(trimVal) + "&jsonp=showYtSuggestions";
            document.body.appendChild(script);
            script.onload = () => script.remove();
        }
    });

    clearYtInput.addEventListener("click", () => {
        overlayYtInput.value = "";
        clearYtInput.style.display = "none";
        ytSuggestions.innerHTML = "";
        setDoc(peekSession, { text: "", time: Date.now() }, { merge: true }).catch(err => {});
        overlayYtInput.focus();
    });

    document.getElementById("overlaySearchForm").addEventListener("submit", (e) => { e.preventDefault(); triggerYTSearch(); });
} 
// =====================================
// CALCULATOR MODE
// =====================================
else if (mode === "calculator") {
    document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%";
    document.getElementById("calculatorArea").hidden = false;
    
    document.getElementById("globalStyles").innerHTML = `
    .calc-wrap { background:#000; height:100vh; display:flex; flex-direction:column; padding:20px; box-sizing:border-box; font-family:sans-serif; }
    .calc-display { flex:1; display:flex; justify-content:flex-end; align-items:flex-end; font-size:70px; color:#fff; padding:20px 10px; font-weight:300; white-space:nowrap; overflow:hidden; text-overflow:clip; transition: font-size 0.1s; }
    .calc-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:15px; padding-bottom:30px; }
    .calc-btn { aspect-ratio:1; border-radius:50%; border:none; font-size:32px; background:#333; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none; touch-action:manipulation; }
    .calc-btn:active { opacity:0.7; }
    .calc-btn.op { background:#f09a36; color:#fff; font-size:38px; }
    .calc-btn.func { background:#a5a5a5; color:#000; }
    .calc-btn.zero { grid-column:span 2; aspect-ratio:auto; border-radius:40px; justify-content:flex-start; padding-left:30px; }
    `;
    
    document.getElementById("calculatorArea").innerHTML = `
    <div class="calc-wrap">
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <div class="calc-btn func" data-val="C">C</div>
            <div class="calc-btn func" data-val="BACK">⌫</div>
            <div class="calc-btn func" data-val="%">%</div>
            <div class="calc-btn op" data-val="/">÷</div>
            <div class="calc-btn" data-val="7">7</div>
            <div class="calc-btn" data-val="8">8</div>
            <div class="calc-btn" data-val="9">9</div>
            <div class="calc-btn op" data-val="*">×</div>
            <div class="calc-btn" data-val="4">4</div>
            <div class="calc-btn" data-val="5">5</div>
            <div class="calc-btn" data-val="6">6</div>
            <div class="calc-btn op" data-val="-">−</div>
            <div class="calc-btn" data-val="1">1</div>
            <div class="calc-btn" data-val="2">2</div>
            <div class="calc-btn" data-val="3">3</div>
            <div class="calc-btn op" data-val="+">+</div>
            <div class="calc-btn zero" data-val="0">0</div>
            <div class="calc-btn" data-val=".">.</div>
            <div class="calc-btn op" data-val="=">=</div>
        </div>
    </div>`;

    let currentExpr = "";
    const calcDisplay = document.getElementById("calcDisplay");

    function updateDisplay(val) {
        currentExpr = val;
        let displayVal = currentExpr === "" ? "0" : currentExpr;
        calcDisplay.innerText = displayVal;
        
        let len = displayVal.length;
        if(len < 7) calcDisplay.style.fontSize = "70px";
        else if(len < 9) calcDisplay.style.fontSize = "55px";
        else if(len < 12) calcDisplay.style.fontSize = "40px";
        else if(len < 16) calcDisplay.style.fontSize = "30px";
        else calcDisplay.style.fontSize = "24px";
    }

    document.querySelectorAll(".calc-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            if(navigator.vibrate) navigator.vibrate(20);
            let val = e.target.getAttribute("data-val");
            let tempExpr = currentExpr;
            
            if (val === "C") { tempExpr = ""; }
            else if (val === "BACK") { 
                if (tempExpr.length > 0 && tempExpr !== "0") { tempExpr = tempExpr.slice(0, -1); }
                if (tempExpr === "") { tempExpr = ""; }
            }
            else if (val === "=") {
                try { tempExpr = eval(tempExpr).toString(); } catch(err) { updateDisplay("Error"); return; }
            }
            else if (val === "%") {
                if(tempExpr) { tempExpr = String(parseFloat(tempExpr) / 100); }
            }
            else {
                if (tempExpr === "0" && val !== ".") tempExpr = val;
                else tempExpr += val;
            }
            updateDisplay(tempExpr);
        });
    });

    let firstSnap = true;
    onSnapshot(peekSession, (snap) => {
        if(!snap.exists()) return;
        const data = snap.data();
        if(firstSnap) { firstSnap = false; return; }
        if(data.text !== undefined) {
            updateDisplay(data.text);
        }
    });
}
// =====================================
// NOTEPAD MODE
// =====================================
else if (mode === "notepad") {
document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%";
document.getElementById("notepadArea").hidden = false;
document.getElementById("notepadArea").innerHTML = `
<div style="width: 100vw; height: 100vh; background: #ffffff; display: flex; flex-direction: column; font-family: sans-serif; box-sizing: border-box; position: relative;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e0e0e0; background: #ffffff;">
    <div style="display: flex; align-items: center; gap: 15px;"><span id="secretYT" style="font-size: 24px; color: #5f6368; cursor: pointer; padding: 5px 15px 5px 0;">←</span><span id="secretTimer" style="font-size: 20px; font-weight: 500; color: #202124; padding: 5px 15px 5px 0;">Notes</span></div>
    <div style="display: flex; align-items: center; gap: 20px;"><button id="secretGoogle" style="background: none; border: none; font-size: 16px; font-weight: 500; cursor: pointer; padding: 5px 0;">Save</button></div>
  </div>
  <div style="flex: 1; padding: 20px; display: flex; flex-direction: column; background: #ffffff; position: relative;">
    <textarea id="fakeNote" style="width: 100%; flex: 1; border: none; outline: none; font-size: 28px; font-weight: bold; line-height: 1.6; color: #202124; background: #ffffff; resize: none;" placeholder="Start typing..."></textarea>
  </div>
</div>`; 

let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0; let searchMode = localStorage.getItem("searchMode") || "2"; 
let isMagicianLive = localStorage.getItem("isMagicianLive") !== "false"; 
window.latestPeekText = ""; 

const noteBox = document.getElementById("fakeNote"), secretYT = document.getElementById("secretYT"), secretTimer = document.getElementById("secretTimer"), secretGoogle = document.getElementById("secretGoogle"); 
if(secretGoogle) secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8"; 

onSnapshot(peekSession, (snap) => { if(snap.exists()) { const data = snap.data(); if(data.text !== undefined && data.text !== null) { window.latestPeekText = data.text; if (isMagicianLive && noteBox) noteBox.value = data.text; } } });
let lastText = "", prevLength = 0;

if(secretGoogle) {
    addLongPress(secretGoogle, () => { isMagicianLive = !isMagicianLive; localStorage.setItem("isMagicianLive", isMagicianLive); secretGoogle.style.color = isMagicianLive ? "green" : "#1a73e8"; if (navigator.vibrate) navigator.vibrate(isMagicianLive ? [100, 50, 100] : [100]); if (isMagicianLive) { if(noteBox) noteBox.value = window.latestPeekText; } else { if(noteBox) noteBox.value = ""; lastText = ""; prevLength = 0; } });
    secretGoogle.addEventListener("click", (e) => { if (noteBox && noteBox.value.trim().length > 0) { triggerMagic(noteBox.value.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; } }); 
}
addLongPress(secretYT, () => { searchMode = searchMode === "1" ? "2" : "1"; localStorage.setItem("searchMode", searchMode); if (navigator.vibrate) navigator.vibrate(200); }); 
addLongPress(secretTimer, () => { let t = prompt("Timer (sec):", magicDelay); if (t !== null && t.trim() !== "") { let seconds = parseInt(t); if (!isNaN(seconds)) { magicDelay = seconds; localStorage.setItem("magicDelay", magicDelay); if (navigator.vibrate) navigator.vibrate(50); } } }); 
addLongPress(noteBox, () => { if (navigator.vibrate) navigator.vibrate([50, 50]); if(noteBox) noteBox.value = ""; lastText = ""; prevLength = 0; window.latestPeekText = ""; setDoc(peekSession, { text: "", time: Date.now() }, { merge: true }).catch(()=>{}); });

if(noteBox) {
    noteBox.addEventListener("input", () => {
        let currentText = noteBox.value;
        setDoc(peekSession, { text: currentText, time: Date.now() }, { merge: true }).catch(()=>{});
        
        if(isMagicianLive) return; 
        if (currentText === "" && lastText.trim().length > 0) { triggerMagic(lastText.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; } else { if (currentText.length > prevLength) { lastText = currentText.trim(); } prevLength = currentText.length; } 
    }); 
    noteBox.addEventListener("keydown", (e) => { if(isMagicianLive) return; if (e.key === "Enter") { e.preventDefault(); if (noteBox.value.trim().length > 0) { triggerMagic(noteBox.value.trim()); noteBox.value = ""; lastText = ""; prevLength = 0; } } }); 
}

function triggerMagic(textToSearch) {
let finalUrl = "", lowerText = textToSearch.toLowerCase(), timeToWait = magicDelay * 1000, suit = "", value = "";
if(lowerText.includes("hukum") || lowerText.includes("spade") || lowerText.includes("हुकुम")) suit = "S"; else if(lowerText.includes("paan") || lowerText.includes("heart") || lowerText.includes("पान")) suit = "H"; else if(lowerText.includes("chidi") || lowerText.includes("club") || lowerText.includes("चिड़ी")) suit = "C"; else if(lowerText.includes("eet") || lowerText.includes("diamond") || lowerText.includes("ईंट")) suit = "D";
if(lowerText.includes("ikka") || lowerText.includes("ace")) value = "A"; else if(lowerText.includes("badshah") || lowerText.includes("king")) value = "K"; else if(lowerText.includes("begum") || lowerText.includes("queen")) value = "Q"; else if(lowerText.includes("gulam") || lowerText.includes("jack")) value = "J"; else if(lowerText.includes("10") || lowerText.includes("दस")) value = "0"; else { for(let i=2; i<=9; i++) { if(lowerText.includes(i.toString())) value = i.toString(); } }

if (suit !== "" && value !== "") { finalUrl = "https://deckofcardsapi.com/static/img/" + value + suit + ".png"; } else if (searchMode === "2") { finalUrl = "https://www.google.com/search?q=" + encodeURIComponent(textToSearch); } else { finalUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(textToSearch); }
setTimeout(async () => { try { await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true }); } catch (err) {} }, timeToWait);
} 
} 
// =====================================
// DECK MODE
// =====================================
else if (mode === "deck") {
document.body.style.margin = "0"; document.body.style.padding = "0"; document.body.style.maxWidth = "100%";
document.getElementById("deckArea").hidden = false;
let magicDelay = parseInt(localStorage.getItem("magicDelay")) || 0; let autoDeckSend = localStorage.getItem("autoDeckSend") !== "false";
const suits = ["S", "H", "C", "D"], values = ["A", "2", "3", "4", "5", "6", "7", "8", "9", "0", "J", "Q", "K"]; let deck = [];
for(let s of suits) { for(let v of values) { deck.push(v + s); } }
for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }

onSnapshot(peekSession, (snap) => { if(snap.exists()) { const data = snap.data(); if(data.text !== undefined && data.text.trim() !== "") { let pk = document.getElementById("deckPeekText"); if(!pk) { pk = document.createElement("div"); pk.id = "deckPeekText"; pk.style.cssText = "position:absolute; top:10px; left:15px; color:rgba(255,255,255,0.4); font-size:12px; font-weight:bold; z-index:9999; pointer-events:none;"; document.body.appendChild(pk); } pk.textContent = data.text; } } });

function renderDeckUI() {
    document.body.style.backgroundColor = "#0f4d0f"; 
    document.getElementById("deckArea").innerHTML = `<div style="width:100vw; height:100vh; background:#0f4d0f; display:flex; flex-direction:column; align-items:center; padding:25px 15px; box-sizing:border-box; overflow:hidden; position:relative;"><div id="secretAutoToggle" style="position:absolute; top:0; right:0; width:60px; height:60px; z-index:100;"></div><div id="deckContainer" style="display:flex; flex-wrap:wrap; justify-content:center; gap:6px; width:100%; max-width:400px; overflow-y:auto; padding-bottom:20px; height:100%;"></div></div>`;
    let html = ""; for(let i=0; i<52; i++) { html += `<img class="card-face" data-index="${i}" src="https://deckofcardsapi.com/static/img/${deck[i]}.png" style="width:50px; height:72px; border-radius:4px; box-shadow:1px 2px 5px rgba(0,0,0,0.5); margin-bottom:5px; cursor:pointer;">`; }
    document.getElementById("deckContainer").innerHTML = html;
    document.querySelectorAll(".card-face").forEach(card => { let lastTap = 0; card.addEventListener("click", function(e) { let tapLength = new Date().getTime() - lastTap; if (tapLength < 400 && tapLength > 0) { selectCard(deck[this.getAttribute("data-index")]); e.preventDefault(); } lastTap = new Date().getTime(); }); });
    addLongPress(document.getElementById("secretAutoToggle"), () => { autoDeckSend = !autoDeckSend; localStorage.setItem("autoDeckSend", autoDeckSend); if(navigator.vibrate) navigator.vibrate(autoDeckSend ? [100, 100, 100] : 300); });
}

function selectCard(cardCode) {
    const finalUrl = "https://deckofcardsapi.com/static/img/" + cardCode + ".png";
    document.body.style.backgroundColor = "#000000"; 
    document.getElementById("deckArea").innerHTML = `<div style="width:100vw; height:100vh; background:#000000; display:flex; align-items:center; justify-content:center; position:relative;"><button id="backToDeck" style="position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.2); border:none; color:white; padding:10px 15px; border-radius:8px; font-size:16px; z-index:10;">← Back</button><img src="${finalUrl}" style="width:100vw; height:100vh; object-fit:contain;"><div id="secretBottomRight" style="position:absolute; bottom:0; right:0; width:80px; height:80px; z-index:10;"></div></div>`;
    document.getElementById("backToDeck").addEventListener("click", () => renderDeckUI());
    const sendCardToAudience = () => { setTimeout(async () => { try { await setDoc(session, { songUrl: finalUrl, seq: Date.now(), updatedAt: serverTimestamp() }, { merge: true }); } catch (err) {} }, magicDelay * 1000); };
    if (autoDeckSend) sendCardToAudience();
    addLongPress(document.getElementById("secretBottomRight"), () => { if(navigator.vibrate) navigator.vibrate(100); sendCardToAudience(); });
}
renderDeckUI();
} 

} catch (e) {
    console.error(e);
}
</script>
</body>
</html>
